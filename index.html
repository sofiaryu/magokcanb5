<html lang="ko"><head><meta charset="utf-8">

<title>원어민 1:1 코칭 신청</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#e5e7eb;--ac:#b8116f;--ac2:#fbe6f1;--no:#9ca3af;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--tx:#eceef0;--mu:#9aa0a6;--bd:#383b3f;--ac2:#3a1a2c;--ac:#d63a95;--no:#6b7077}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--tx:#eceef0;--mu:#9aa0a6;--bd:#383b3f;--ac2:#3a1a2c;--ac:#d63a95;--no:#6b7077}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:4px 0 10px}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:9px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;text-align:center;min-width:64px}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip small{display:block;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.slot.full{background:var(--bd);color:var(--no);cursor:not-allowed;text-decoration:line-through}
.mu{color:var(--mu);font-size:13px}.er{color:var(--er)}
.bn{background:var(--ac2);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;white-space:nowrap}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md .card{width:100%;max-width:420px;max-height:90vh;overflow:auto}
label{font-size:13px;color:var(--mu)}
.rd{display:flex;gap:16px;margin:6px 0 12px}.rd label{color:var(--tx);font-size:15px}.rd input{width:auto;margin:0 6px 0 0}
.logo{display:block;margin:8px auto 16px;width:150px;max-width:50%;height:auto}.logo.s{width:72px;margin:0}
input,select{font-size:16px}.my{border-left:4px solid var(--ac);margin-bottom:8px}
@media(min-width:900px){main{max-width:860px;padding:28px}h1{font-size:24px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.logo{width:190px}}
@media(max-width:480px){main{padding:12px}h1{font-size:17px;margin:2px 0}h2{font-size:15px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:14px}.md{align-items:flex-end;padding:0}.md .card{max-width:none;border-radius:16px 16px 0 0}button{padding:11px 14px}.chip{min-width:58px}}
</style></head><body><main id="app"></main>

 const sl=ld("ft_slots");if(sl[k])return false;sl[k]=1;sv("ft_slots",sl);const ap=ld("ft_apps");ap[k]=rec;sv("ft_apps",ap);S.slots=sl;S.apps=ap;return true}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
if(FIREBASE_CONFIG.apiKey){
 const app=initializeApp(FIREBASE_CONFIG),db=getFirestore(app),au=getAuth(app);
 window.FB={
  subSlots:cb=>onSnapshot(collection(db,"slots"),q=>cb(q.docs.map(d=>d.id)),()=>{}),
  subApps:(cb,er)=>onSnapshot(collection(db,"apps"),q=>cb(q.docs.map(d=>d.data())),er),
  async book(k,rec){const b=writeBatch(db);b.set(doc(db,"slots",k),{taken:true});b.set(doc(db,"apps",k),rec);
   try{await b.commit();return true}catch(e){if(e.code=="permission-denied")return false;throw e}},
  async cancel(k){const b=writeBatch(db);b.delete(doc(db,"apps",k));b.delete(doc(db,"slots",k));await b.commit()},
  login:pw=>signInWithEmailAndPassword(au,ADMIN_EMAIL,pw),
  logout:()=>signOut(au)};
 window.dispatchEvent(new Event("fb-ready"));
}
</script></body></html>
